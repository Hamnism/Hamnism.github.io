{{- /* キャンペーンのバナー (data/campaign.yaml)。引数: ページ。enabled が false か、skip に入っている記事では出さない。 */ -}}
{{- $c := hugo.Data.campaign -}}
{{- if and $c $c.enabled (not (in ($c.skip | default slice) .Params.id)) }}
{{- $href := $c.link | default site.Params.appStoreURL -}}
<a class="campaign" href="{{ $href }}"{{ if hasPrefix $href "http" }} target="_blank" rel="noopener"{{ end }}>
  <img src="{{ $c.image | relURL }}" srcset="{{ $c.image_small | relURL }} 800w, {{ $c.image | relURL }} 1600w" sizes="(max-width: 820px) 100vw, 720px" width="1600" height="900" alt="{{ $c.alt }}" loading="lazy">
</a>
{{- end }}
