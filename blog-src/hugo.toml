# Lichen ブログ (hamnism.com/lichen/blog/) の設定。
# 記事の書き方は README.md を参照。
baseURL = "https://hamnism.com/lichen/blog/"
locale = "ja"
defaultContentLanguage = "ja"
title = "Lichen Blog"
hasCJKLanguage = true
disableKinds = ["taxonomy", "term"]
enableGitInfo = false

[permalinks]
  guide = "/guide/:slug/"
  story = "/story/:slug/"

[params]
  description = "iPhoneとiPadのための掲示板専用ブラウザLichenの使い方と、作っている人のはなし。"
  tagline = "iPhoneとiPadのための掲示板専用ブラウザ。使い方と、作っている人のはなし。"
  # Google アナリティクス (GA4) の測定 ID。"G-XXXXXXXXXX" を入れると計測が始まる。空なら何も読み込まない。
  author = "Hamnism"
  # SNS カードの共通画像 (記事に ogimage / cover が無い時とトップページ)。blog-src/static/ に置く。
  ogImage = "ogp.jpg"
  ga4 = ""
  # App Store へのリンク。キャンペーンリンクを発行したらここを差し替える (ブログ経由の DL 数が分かる)。
  appStoreURL = "https://apps.apple.com/jp/app/lichen/id6771805838"
  formURL = "https://forms.gle/Ye8MgjpmATaZuPuD6"
  lpURL = "https://hamnism.com/lichen/"
  termsURL = "https://hamnism.com/lichen/terms.html"
  privacyURL = "https://hamnism.com/lichen/privacy.html"

[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "searchindex"
  isPlainText = true
  notAlternative = true

[services.rss]
  limit = 30

[sitemap]
  changefreq = "weekly"
