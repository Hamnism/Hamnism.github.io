# 記事末尾の定型文。記事の front matter の `closing: 1` / `closing: 2` で選ぶ。
# 文面は Google Drive「末尾の定型文章」が正。変えたらここも直す。
# 並び: first (パターンごとの書き出し) → common → お問い合わせフォーム → last → App Store ボタン
first:
  "1": "今回の記事の内容は参考になりましたでしょうか？"
  "2": "最後まで読んでいただき、ありがとうございました。"
common:
  - "掲示板専用ブラウザ「Lichen」はiOS機能をフルに活用したUI/UXと、丁寧に作り込んだタイポグラフィで快適な専ブラ体験を目指しています。"
  - "皆様からのご要望やフィードバックが日々の開発の励みとなりますので、お気づきの点がありましたらお気軽にお問い合わせください。"
last:
  - "まだ、Lichenを体験したことがなく、このアプリが気になった方はApp Storeからインストールしてみてください。"
  - "それでは、次回またお会いしましょう。"
