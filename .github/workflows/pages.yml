# hamnism.com を公開する。
# リポジトリ直下の静的ファイル (LP / 規約 / リリースノート) はそのまま、
# blog-src/ は Hugo でビルドして /lichen/blog/ に置く。
name: Deploy site

on:
  push:
    branches: [main]
  # 未来の日付で予約した記事を出すため、毎朝 6:05 (JST) にもビルドする。
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - name: Assemble static site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git --exclude .github --exclude .gitignore \
            --exclude _site --exclude blog-src --exclude .DS_Store
      - name: Build blog
        env:
          TZ: Asia/Tokyo
        run: hugo --source blog-src --destination "${GITHUB_WORKSPACE}/_site/lichen/blog" --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
