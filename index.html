<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamnism</title>
<meta name="description" content="Hamnism のアプリ一覧。iOS 用 monazilla 互換掲示板ブラウザ Lichen ほか。">
<link rel="canonical" href="https://hamnism.com/">
<meta property="og:title" content="Hamnism">
<meta property="og:url" content="https://hamnism.com/">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #ffffff;
    --ink1: #15171c;
    --ink3: #757b85;
    --ink5: #d4d8de;
    --teal: #1FA68A;
    --indigo: #6B58C2;
    --magenta: #C95584;
    --coral: #FF8557;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141a;
      --ink1: #e8eaf0;
      --ink3: #8a9099;
      --ink5: #2a2f36;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink1);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    line-height: 1.7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .wrap { padding: 32px 24px; max-width: 480px; }
  h1 {
    font-size: 28px;
    background: linear-gradient(90deg, var(--teal), var(--indigo), var(--magenta), var(--coral));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 8px;
    letter-spacing: 1px;
  }
  p { color: var(--ink3); font-size: 13px; margin: 0 0 24px; }
  ul { padding-left: 20px; font-size: 14px; }
  li { margin-bottom: 6px; }
  a { color: var(--teal); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-50Y57JTGTK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-50Y57JTGTK');
  // App Store へのリンクのクリックを「app_store_click」として記録 (どのボタンかを link_text に)
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href*="apps.apple.com"]');
    if (!a) return;
    gtag('event', 'app_store_click', { link_text: (a.textContent || a.querySelector('img')?.alt || '').trim().slice(0, 50), page_path: location.pathname });
  });
</script>
</head>
<body>
<div class="wrap">
  <h1>Hamnism</h1>
  <p>Apps by Hamnism.</p>
  <ul>
    <li><a href="lichen/">Lichen — iOS 用 monazilla 互換掲示板ブラウザ</a></li>
  </ul>
  <p>Contact: <a href="mailto:info@hamnism.com">info@hamnism.com</a></p>
</div>
</body>
</html>
