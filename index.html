<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamnism</title>
<style>
  :root {
    --bg: #ffffff;
    --ink1: #15171c;
    --ink3: #757b85;
    --ink5: #d4d8de;
    --teal: #1FA68A;
    --coral: #FF8557;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141a;
      --ink1: #e8eaf0;
      --ink3: #8a9099;
      --ink5: #2a2f36;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink1);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    line-height: 1.7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .wrap { padding: 32px 24px; max-width: 480px; }
  h1 {
    font-size: 28px;
    background: linear-gradient(90deg, var(--teal), var(--coral));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 8px;
    letter-spacing: 1px;
  }
  p { color: var(--ink3); font-size: 13px; margin: 0 0 24px; }
  ul { padding-left: 20px; font-size: 14px; }
  li { margin-bottom: 6px; }
  a { color: var(--teal); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hamnism</h1>
  <p>Apps by Mano Tachihara.</p>
  <ul>
    <li><a href="lichen/">Lichen — iOS 用 monazilla 互換掲示板ブラウザ</a></li>
  </ul>
</div>
</body>
</html>
